pre-commit:
  parallel: true

  jobs:
    - name: "api"
      group:
        piped: true
        root: "api/"
        jobs:
          - run: "composer run lint -- --fix {staged_files}"
            glob: "*.php"
            stage_fixed: true
          - run: "composer run format -- {staged_files}"
            glob: "*.php"
            stage_fixed: true

    - name: "client"
      group:
        piped: true
        root: "client/"
        jobs:
          - run: "npm run lint -- --fix {staged_files}"
            glob: "*.{js,ts,svelte}"
            stage_fixed: true
          - run: "npm run format -- {staged_files}"
            glob: "*.{json,js,ts,svelte}"
            stage_fixed: true

pre-push:
  parallel: true

  jobs:
    - run: "composer run lint"
      root: "api/"
      glob: "*.php"
    - run: "npm run lint -- --max-warnings=0"
      root: "client/"
      glob: "*.{js,ts,svelte}"
    - run: "npm run check -- --fail-on-warnings"
      root: "client/"
      glob: "*.{js,ts,svelte}"
    - run: "composer test"
      root: "api/"
    - run: "npm test run"
      skip: true

commit-msg:
  jobs:
    - run: cz check --allow-abort --commit-msg-file {1}
